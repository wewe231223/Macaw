        [&quot;MacawHeaderTool&quot;, &quot;FHeaderParser&quot;, &quot;ParseHeader()&quot;, &quot;리플렉션과 내보내기 선언을 파싱합니다.&quot;],
        [&quot;MacawHeaderTool&quot;, &quot;리플렉션 산출물&quot;, &quot;WriteGeneratedHeaders() / 등록 소스 생성&quot;, &quot;생성 헤더와 모듈별 등록 코드를 준비합니다.&quot;],
        [&quot;MacawHeaderTool&quot;, &quot;Script 바인딩 산출물&quot;, &quot;ScriptBindings.cpp + ScriptBindings.g.cs&quot;, &quot;네이티브 thunk와 관리 래퍼를 같은 선언에서 생성합니다.&quot;],
        [&quot;빌드&quot;, &quot;Script / Macaw.Engine&quot;, &quot;생성 소스 컴파일&quot;, &quot;각각 C++ 브리지와 C# API 어셈블리로 빌드합니다.&quot;]
      ],
      Related: [&quot;MacawHeaderTool&quot;, &quot;CoreUObject&quot;, &quot;Script&quot;, &quot;Macaw.Engine&quot;],
      Sources: [&quot;premake5.lua&quot;, &quot;Source/Programs/MacawHeaderTool/Main.cpp&quot;, &quot;Source/Programs/MacawHeaderTool/BindingGenerator.cpp&quot;, &quot;Source/Managed/Macaw.Engine/Macaw.Engine.csproj&quot;]
    }
  };

  const MarkerIds = { Public: &quot;Arrow&quot;, Private: &quot;Arrow&quot;, Link: &quot;Arrow&quot;, Build: &quot;Arrow&quot;, Is: &quot;Triangle&quot;, Use: &quot;Arrow&quot; };
  const AllEdges = [...ModuleEdges, ...BuildEdges];
  const DefaultState = { View: &quot;map&quot;, Module: &quot;Editor&quot;, Flow: &quot;Frame&quot; };
  let State = { ...DefaultState };
  let Resize;

  function Element(Tag, ClassName, Label) {
    const Node = document.createElement(Tag);

    if (ClassName) {
      Node.className = ClassName;
    }

    if (Label) {
      Node.textContent = Label;
    }

    return Node;
  }

  function Button(Label, Handler, Primary = false) {
    const Node = Element(&quot;button&quot;, Primary ? &quot;btn btn-primary&quot; : &quot;btn&quot;, Label);
    Node.type = &quot;button&quot;;
    Node.addEventListener(&quot;click&quot;, Handler);

    return Node;
  }

  function Svg(Tag, Attributes) {
    const Node = document.createElementNS(SvgNamespace, Tag);

    for (const [Name, Value] of Object.entries(Attributes)) {
      Node.setAttribute(Name, Value);
    }

    return Node;
  }

  function DisplayName(Name) {
    return Views[Name].Title || Name;
  }

  function Switch(View, Value) {
    State.View = View;

    if (View === &quot;detail&quot;) {
      State.Module = Value;
    }

    if (View === &quot;flow&quot; &amp;&amp; Value) {
      State.Flow = Value;
    }

    Render();
    window.openai?.setWidgetState?.({ modelContent: { View: State.View, Module: DisplayName(State.Module), Flow: Flows[State.Flow].Title }, privateContent: State })?.catch(() =&gt; {});
  }

  function ApplyState(Saved) {
    const Values = Saved?.privateContent || Saved;

    if (!Values) {
      return;
    }

    State = {
      View: [&quot;map&quot;, &quot;detail&quot;, &quot;flow&quot;].includes(Values.View) ? Values.View : DefaultState.View,
      Module: Object.hasOwn(Views, Values.Module) ? Values.Module : DefaultState.Module,
      Flow: Object.hasOwn(Flows, Values.Flow) ? Values.Flow : DefaultState.Flow
    };

    Render();
  }

  function MarkerSet(Prefix) {
    const Defs = Svg(&quot;defs&quot;, {});
    const Arrow = Svg(&quot;marker&quot;, { id: Prefix + &quot;Arrow&quot;, markerWidth: 8, markerHeight: 8, refX: 7, refY: 4, orient: &quot;auto&quot;, markerUnits: &quot;userSpaceOnUse&quot; });
    const Triangle = Svg(&quot;marker&quot;, { id: Prefix + &quot;Triangle&quot;, markerWidth: 11, markerHeight: 10, refX: 10, refY: 5, orient: &quot;auto&quot;, markerUnits: &quot;userSpaceOnUse&quot; });
    const Diamond = Svg(&quot;marker&quot;, { id: Prefix + &quot;Diamond&quot;, markerWidth: 12, markerHeight: 9, refX: 0, refY: 4.5, orient: &quot;auto&quot;, markerUnits: &quot;userSpaceOnUse&quot; });

    Arrow.append(Svg(&quot;path&quot;, { d: &quot;M 1 1 L 7 4 L 1 7&quot;, fill: &quot;none&quot;, stroke: &quot;context-stroke&quot;, &quot;stroke-width&quot;: 1.2 }));
    Triangle.append(Svg(&quot;path&quot;, { d: &quot;M 1 1 L 10 5 L 1 9 Z&quot;, fill: &quot;var(--background)&quot;, stroke: &quot;context-stroke&quot;, &quot;stroke-width&quot;: 1.1 }));
    Diamond.append(Svg(&quot;path&quot;, { d: &quot;M 0 4.5 L 5.5 1 L 11 4.5 L 5.5 8 Z&quot;, fill: &quot;context-stroke&quot; }));
    Defs.append(Arrow, Triangle, Diamond);

    return Defs;
  }

  function Wire(Points, Kind, Prefix) {
    const Node = Svg(&quot;polyline&quot;, { class: &quot;AtlasEdge&quot;, &quot;data-kind&quot;: Kind, points: Points.map((Point) =&gt; Point.join(&quot;,&quot;)).join(&quot; &quot;) });

    if (Kind === &quot;Own&quot;) {
      Node.setAttribute(&quot;marker-start&quot;, &quot;url(#&quot; + Prefix + &quot;Diamond)&quot;);
    } else {
      Node.setAttribute(&quot;marker-end&quot;, &quot;url(#&quot; + Prefix + MarkerIds[Kind] + &quot;)&quot;);
    }

    return Node;
  }

  function Legend(Kinds, Key) {
    const List = Element(&quot;div&quot;, &quot;AtlasLegend text-small&quot;);
    List.setAttribute(&quot;aria-label&quot;, &quot;관계선 범례&quot;);

    for (const Kind of Kinds) {
      const Item = Element(&quot;span&quot;);
      const Prefix = &quot;MacawLegend&quot; + Key + Kind;
      const Icon = Svg(&quot;svg&quot;, { viewBox: &quot;0 0 29 16&quot;, &quot;aria-hidden&quot;: &quot;true&quot; });
      Icon.append(MarkerSet(Prefix), Wire([[1, 8], [27, 8]], Kind, Prefix));
      Item.append(Icon, Element(&quot;span&quot;, &quot;&quot;, EdgeNames[Kind]));
      List.append(Item);
    }

    return List;
  }

  function Box(Node, Origin) {
    const Rect = Node.getBoundingClientRect();

    return { L: Rect.left - Origin.left, R: Rect.right - Origin.left, T: Rect.top - Origin.top, B: Rect.bottom - Origin.top, X: (Rect.left + Rect.right) / 2 - Origin.left, Y: (Rect.top + Rect.bottom) / 2 - Origin.top };
  }

  function Crosses(A, B, Rect) {
    const Pad = 3;

    if (A[0] === B[0]) {
      return A[0] &gt; Rect.L - Pad &amp;&amp; A[0] &lt; Rect.R + Pad &amp;&amp; Math.max(A[1], B[1]) &gt; Rect.T - Pad &amp;&amp; Math.min(A[1], B[1]) &lt; Rect.B + Pad;
    }

    return A[1] &gt; Rect.T - Pad &amp;&amp; A[1] &lt; Rect.B + Pad &amp;&amp; Math.max(A[0], B[0]) &gt; Rect.L - Pad &amp;&amp; Math.min(A[0], B[0]) &lt; Rect.R + Pad;
  }

  function Route(From, To, Boxes, Bounds) {
    const Gap = 7;
    const Ports = (Rect) =&gt; [
      [[Rect.X, Rect.T - 1], [Rect.X, Rect.T - Gap], &quot;V&quot;],
      [[Rect.X, Rect.B + 1], [Rect.X, Rect.B + Gap], &quot;V&quot;],
      [[Rect.L - 1, Rect.Y], [Rect.L - Gap, Rect.Y], &quot;H&quot;],
      [[Rect.R + 1, Rect.Y], [Rect.R + Gap, Rect.Y], &quot;H&quot;]
    ];
    const Others = Boxes.filter((Rect) =&gt; Rect !== From &amp;&amp; Rect !== To);
    const XLanes = [2, Bounds.width - 2, (From.X + To.X) / 2, ...Boxes.flatMap((Rect) =&gt; [Rect.L - 6, Rect.R + 6])];
    const YLanes = [2, Bounds.height - 2, (From.Y + To.Y) / 2, ...Boxes.flatMap((Rect) =&gt; [Rect.T - 6, Rect.B + 6])];
    let Best;
    let BestCost = Infinity;

    for (const [Start, A, AxisA] of Ports(From)) {
      for (const [End, B, AxisB] of Ports(To)) {
        let Candidates;

        if (AxisA !== AxisB) {
          Candidates = [[AxisA === &quot;V&quot; ? [A[0], B[1]] : [B[0], A[1]]]];
        } else if (AxisA === &quot;V&quot;) {
          Candidates = YLanes.map((Y) =&gt; [[A[0], Y], [B[0], Y]]);
          Candidates.push(...XLanes.map((X) =&gt; [[X, A[1]], [X, B[1]]]));
        } else {
          Candidates = XLanes.map((X) =&gt; [[X, A[1]], [X, B[1]]]);
          Candidates.push(...YLanes.map((Y) =&gt; [[A[0], Y], [B[0], Y]]));
        }

        for (const Middle of Candidates) {
          const Points = [Start, A, ...Middle, B, End].filter((Point, Index, All) =&gt; Index === 0 || Point[0] !== All[Index - 1][0] || Point[1] !== All[Index - 1][1]);
          let Cost = Points.length * 3;

          for (let Index = 1; Index &lt; Points.length; ++Index) {
            const P = Points[Index - 1];
            const Q = Points[Index];
            Cost += Math.abs(P[0] - Q[0]) + Math.abs(P[1] - Q[1]);
            Cost += Others.filter((Rect) =&gt; Crosses(P, Q, Rect)).length * 2000;

            if (Index &gt; 1 &amp;&amp; Crosses(P, Q, From)) {
              Cost += 2000;
            }

            if (Index &lt; Points.length - 1 &amp;&amp; Crosses(P, Q, To)) {
              Cost += 2000;
            }
          }

          if (Cost &lt; BestCost) {
            Best = Points;
            BestCost = Cost;
          }
        }
      }
    }

    return Best;
  }

  function RouteCoreBranch(From, To) {
    const Direction = Math.sign(To.X - From.X);
    const Start = From.X + Direction * (From.R - From.L) / 4;
    const Bend = (From.B + To.T) / 2;

    return [[Start, From.B + 1], [Start, Bend], [To.X, Bend], [To.X, To.T - 1]];
  }

  function Graph(Rows, EdgeProvider, Kind, Key) {
    const Container = Element(&quot;div&quot;, &quot;AtlasGraph&quot;);
    Container.dataset.kind = Kind;
    const Prefix = &quot;MacawGraph&quot; + Key;
    const Drawing = Svg(&quot;svg&quot;, { class: &quot;AtlasWires&quot;, &quot;aria-hidden&quot;: &quot;true&quot; });
    const Nodes = new Map();

    Container.append(Drawing);

    for (const [GroupName, Descriptions, IsCore] of Rows) {
      const Group = Element(&quot;div&quot;, &quot;AtlasGroup&quot;);
      const Row = Element(&quot;div&quot;, IsCore ? &quot;AtlasRow AtlasCoreRow&quot; : &quot;AtlasRow&quot;);

      if (GroupName) {
        Group.append(Element(&quot;span&quot;, &quot;AtlasGroupTitle text-small text-muted&quot;, GroupName));
      }

      for (const Description of Descriptions) {
        const [Name, Role, Target] = Description.split(&quot;|&quot;);
        const IsMap = Kind === &quot;map&quot;;
        const Node = IsMap || Target ? Button(&quot;&quot;, () =&gt; Switch(&quot;detail&quot;, Target || Name)) : Element(&quot;div&quot;);

        if (IsMap) {
          Node.classList.add(&quot;AtlasMapNode&quot;);
          Node.setAttribute(&quot;aria-label&quot;, Name + &quot; 클래스 관계&quot;);
          Node.dataset.module = Name;
        } else {
          Node.classList.add(&quot;AtlasNode&quot;);
        }

        if (Target) {
          Node.dataset.external = &quot;true&quot;;
          Node.dataset.tooltip = DisplayName(Target) + &quot; 상세도&quot;;
          Node.setAttribute(&quot;aria-label&quot;, Name + &quot; · &quot; + DisplayName(Target) + &quot; 상세도&quot;);
        }

        Node.append(Element(&quot;code&quot;, &quot;&quot;, Name), Element(&quot;span&quot;, &quot;text-small&quot;, Role));
        Nodes.set(Name, Node);
        Row.append(Node);
      }

      Group.append(Row);
      Container.append(Group);
    }

    function Draw() {
      const Bounds = Container.getBoundingClientRect();

      if (!Bounds.width || !Bounds.height) {
        return;
      }

      const Positions = new Map([...Nodes].map(([Name, Node]) =&gt; [Name, Box(Node, Bounds)]));
      const Labels = [...Container.querySelectorAll(&quot;.AtlasGroupTitle&quot;)].map((Label) =&gt; Box(Label, Bounds));
      const Boxes = [...Positions.values(), ...Labels];
      const Active = EdgeProvider();
      Drawing.replaceChildren(MarkerSet(Prefix));

      for (const [From, To, Relation] of Active) {
        const Source = Positions.get(From);
        const Target = Positions.get(To);
        const IsCoreBranch = Kind === &quot;map&quot; &amp;&amp; CoreModules.has(From) &amp;&amp; CoreModules.has(To) &amp;&amp; Source.B &lt; Target.T &amp;&amp; Math.abs(Source.X - Target.X) &gt; 1;
        const Points = IsCoreBranch ? RouteCoreBranch(Source, Target) : Route(Source, Target, Boxes, Bounds);
        Drawing.append(Wire(Points, Relation, Prefix));
      }
    }

    Resize.observe(Container);
    Container.addEventListener(&quot;atlasdraw&quot;, Draw);
    requestAnimationFrame(Draw);

    return Container;
  }

  function SourcePaths(Paths) {
    const Details = Element(&quot;details&quot;, &quot;AtlasSources text-small&quot;);
    const List = Element(&quot;ul&quot;);

    for (const Path of Paths) {
      const Item = Element(&quot;li&quot;);
      Item.append(Element(&quot;code&quot;, &quot;AtlasPath&quot;, Path));
      List.append(Item);
    }

    Details.append(Element(&quot;summary&quot;, &quot;&quot;, &quot;근거 소스 경로&quot;), List);

    return Details;
  }

  function RelationText(Edges, Title = &quot;관계 목록&quot;) {
    const Details = Element(&quot;details&quot;, &quot;AtlasRelations text-small&quot;);
    const List = Element(&quot;ul&quot;);

    for (const [From, To, Kind] of Edges) {
      List.append(Element(&quot;li&quot;, &quot;&quot;, From + &quot; → &quot; + To + &quot; · &quot; + EdgeNames[Kind]));
    }

    Details.append(Element(&quot;summary&quot;, &quot;&quot;, Title), List);

    return Details;
  }

  function DependencyLines(Name, Kinds) {
    const Lines = Element(&quot;div&quot;, &quot;AtlasContext text-small&quot;);
    const Outgoing = AllEdges.filter(([From, , Kind]) =&gt; From === Name &amp;&amp; Kinds.includes(Kind));
    const Incoming = AllEdges.filter(([, To, Kind]) =&gt; To === Name &amp;&amp; Kinds.includes(Kind));

    for (const [Label, Edges, Index] of [[&quot;이 대상이 의존하는 쪽&quot;, Outgoing, 1], [&quot;이 대상에 의존하는 쪽&quot;, Incoming, 0]]) {
      const Groups = Kinds.map((Kind) =&gt; [Kind, Edges.filter((Edge) =&gt; Edge[2] === Kind).map((Edge) =&gt; Edge[Index])]).filter(([, Nodes]) =&gt; Nodes.length &gt; 0);

      if (Groups.length) {
        const Text = Groups.map(([Kind, Nodes]) =&gt; EdgeNames[Kind] + &quot; · &quot; + Nodes.join(&quot;, &quot;)).join(&quot; / &quot;);
        const Line = Element(&quot;div&quot;);
        Line.append(Element(&quot;strong&quot;, &quot;&quot;, Label), document.createTextNode(&quot; · &quot; + Text));
        Lines.append(Line);
      }
    }

    if (!Lines.children.length) {
      Lines.append(Element(&quot;div&quot;, &quot;text-muted&quot;, &quot;별도 Utility 프로젝트&quot;));
    }

    return Lines;
  }

  function MapKinds(Name) {
    return Object.hasOwn(Dependencies, Name) ? [&quot;Public&quot;, &quot;Private&quot;] : [&quot;Link&quot;, &quot;Build&quot;];
  }

  function MapView() {
    const Main = Element(&quot;section&quot;, &quot;AtlasStack&quot;);
    const Heading = Element(&quot;div&quot;, &quot;AtlasTitle&quot;);
    Heading.append(Element(&quot;h2&quot;, &quot;&quot;, &quot;전체 모듈과 실행 대상&quot;));
    const Groups = Groupings.map(([Label, Names]) =&gt; [Label, Names.map((Name) =&gt; Name + &quot;|&quot; + Views[Name].Role), CoreModules.has(Names[0])]);
    let HoveredModule = &quot;&quot;;
    let PreviewedModule = &quot;&quot;;
    let VisibleEdges = CoreEdges;
    const Canvas = Graph(Groups, () =&gt; VisibleEdges, &quot;map&quot;, &quot;Map&quot;);
    const Nodes = Canvas.querySelectorAll(&quot;.AtlasMapNode&quot;);
    const Focus = Element(&quot;div&quot;, &quot;AtlasContext&quot;);
    const CoreRelations = RelationText(CoreEdges, &quot;핵심 모듈 직접 의존성&quot;);
    Focus.append(CoreRelations);

    function UpdatePreview() {
      const Name = HoveredModule || Canvas.querySelector(&quot;.AtlasMapNode:focus-visible&quot;)?.dataset.module || &quot;&quot;;

      if (PreviewedModule === Name) {
        return;
      }

      PreviewedModule = Name;

      for (const Node of Nodes) {
        Node.dataset.focus = String(Node.dataset.module === Name);
      }

      if (Name) {
        const Kinds = MapKinds(Name);
        VisibleEdges = AllEdges.filter(([From, To, Kind]) =&gt; (From === Name || To === Name) &amp;&amp; Kinds.includes(Kind));
        Focus.replaceChildren(Element(&quot;h3&quot;, &quot;&quot;, Name + &quot; · 직접 관계&quot;), DependencyLines(Name, Kinds));
      } else {
        VisibleEdges = CoreEdges;
        Focus.replaceChildren(CoreRelations);
      }

      Canvas.dispatchEvent(new Event(&quot;atlasdraw&quot;));
    }

    for (const Node of Nodes) {
      Node.addEventListener(&quot;pointerenter&quot;, (Event) =&gt; {
        if (Event.pointerType !== &quot;touch&quot;) {
          HoveredModule = Node.dataset.module;
          UpdatePreview();
        }
      });
      Node.addEventListener(&quot;pointerleave&quot;, () =&gt; {
        if (HoveredModule === Node.dataset.module) {
          HoveredModule = &quot;&quot;;
          UpdatePreview();
        }
      });
      Node.addEventListener(&quot;focus&quot;, UpdatePreview);
      Node.addEventListener(&quot;blur&quot;, () =&gt; queueMicrotask(UpdatePreview));
    }

    Main.append(Heading, Legend([&quot;Public&quot;, &quot;Private&quot;, &quot;Link&quot;, &quot;Build&quot;], &quot;Map&quot;), Canvas, Focus, SourcePaths([&quot;ModuleDependencies.json&quot;, &quot;premake5.lua&quot;]));

    return Main;
  }

  function Related(Names, FlowKeys) {
    const Group = Element(&quot;div&quot;, &quot;AtlasContext&quot;);

    if (Names.length) {
      const Row = Element(&quot;div&quot;, &quot;AtlasLinks&quot;);
      Row.append(Element(&quot;span&quot;, &quot;text-small text-muted&quot;, &quot;관련 구조&quot;));

      for (const Name of Names) {
        Row.append(Button(DisplayName(Name), () =&gt; Switch(&quot;detail&quot;, Name)));
      }

      Group.append(Row);
    }

    if (FlowKeys.length) {
      const Row = Element(&quot;div&quot;, &quot;AtlasLinks&quot;);
      Row.append(Element(&quot;span&quot;, &quot;text-small text-muted&quot;, &quot;관련 실행&quot;));

      for (const Key of FlowKeys) {
        Row.append(Button(Flows[Key].Title, () =&gt; Switch(&quot;flow&quot;, Key)));
      }

      Group.append(Row);
    }

    return Group;
  }

  function DetailView() {
    const Name = State.Module;
    const View = Views[Name];
    const Main = Element(&quot;section&quot;, &quot;AtlasStack&quot;);
    const Heading = Element(&quot;div&quot;, &quot;AtlasTitle&quot;);
    Heading.append(Element(&quot;h2&quot;, &quot;&quot;, DisplayName(Name)), Element(&quot;p&quot;, &quot;text-small text-muted&quot;, View.Role));
    Main.append(Heading, Legend([&quot;Own&quot;, &quot;Is&quot;, &quot;Use&quot;], &quot;Detail&quot;));

    for (const [Index, [Title, Rows, Edges]] of View.Graphs.entries()) {
      const Section = Element(&quot;section&quot;, &quot;AtlasStack AtlasSubgraph&quot;);
      Section.append(Element(&quot;h3&quot;, &quot;&quot;, Title), Graph(Rows.map((Row) =&gt; [&quot;&quot;, Row]), () =&gt; Edges, &quot;detail&quot;, &quot;Detail&quot; + Index), RelationText(Edges));
      Main.append(Section);
    }

    if (Groupings.some(([, Names]) =&gt; Names.includes(Name))) {
      Main.append(DependencyLines(Name, MapKinds(Name)));
    }

    Main.append(Related(View.Related, View.Flows), SourcePaths(View.Sources));

    return Main;
  }

  function FlowView() {
    const Flow = Flows[State.Flow];
    const Main = Element(&quot;section&quot;, &quot;AtlasStack&quot;);
    const Select = Element(&quot;select&quot;, &quot;form-select&quot;);
    const Label = Element(&quot;label&quot;, &quot;form-label&quot;, &quot;실행 흐름&quot;);

    for (const [Key, Item] of Object.entries(Flows)) {
      const Option = Element(&quot;option&quot;, &quot;&quot;, Item.Title);
      Option.value = Key;
      Select.append(Option);
    }

    Select.value = State.Flow;
    Select.addEventListener(&quot;change&quot;, () =&gt; {
      Switch(&quot;flow&quot;, Select.value);
      Content.querySelector(&quot;select&quot;).focus();
    });
    Label.append(Select);

    const List = Element(&quot;ol&quot;, &quot;AtlasSequence&quot;);

    for (const [From, To, Call, Summary] of Flow.Steps) {
      const Item = Element(&quot;li&quot;, &quot;AtlasMessage&quot;);
      const Info = Element(&quot;div&quot;, &quot;AtlasCall&quot;);
      const Parties = Element(&quot;div&quot;, &quot;AtlasParties&quot;);
      Parties.append(Element(&quot;code&quot;, &quot;&quot;, From), Element(&quot;span&quot;, &quot;&quot;, &quot;→&quot;), Element(&quot;code&quot;, &quot;&quot;, To));
      Info.append(Parties, Element(&quot;code&quot;, &quot;&quot;, Call), Element(&quot;span&quot;, &quot;text-small text-muted&quot;, Summary));
      Item.append(Info);
      List.append(Item);
    }

    Main.append(Label, Element(&quot;h2&quot;, &quot;&quot;, Flow.Title), List, Related(Flow.Related, []), SourcePaths(Flow.Sources));

    return Main;
  }

  function Render() {
    Resize?.disconnect();
    Resize = new ResizeObserver((Entries) =&gt; {
      for (const Entry of Entries) {
        Entry.target.dispatchEvent(new Event(&quot;atlasdraw&quot;));
      }
    });

    for (const Button of Root.querySelectorAll(&quot;[data-view]&quot;)) {
      const Active = Button.dataset.view === (State.View === &quot;detail&quot; ? &quot;map&quot; : State.View);
      Button.classList.toggle(&quot;btn-primary&quot;, Active);
      Button.setAttribute(&quot;aria-pressed&quot;, String(Active));
    }

    if (State.View === &quot;map&quot;) {
      Content.replaceChildren(MapView());
    } else if (State.View === &quot;detail&quot;) {
      Content.replaceChildren(DetailView());
    } else {
      Content.replaceChildren(FlowView());
    }

    Status.textContent = Content.querySelector(&quot;h2&quot;).textContent;
  }

  for (const Node of Root.querySelectorAll(&quot;[data-view]&quot;)) {
    Node.addEventListener(&quot;click&quot;, () =&gt; Switch(Node.dataset.view));
  }

  Render();
  ApplyState(window.openai?.widgetState);
  window.addEventListener(&quot;openai:set_globals&quot;, (Event) =&gt; ApplyState(Event.detail?.globals?.widgetState));
})();

    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const persistSize = () => {
    globalThis.clearTimeout(sizeWriteTimeout);
    if (pendingSize == null) {
      return;
    }
    try {
      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }
    pendingSize = null;
  };
  if (isShare) {
    globalThis.addEventListener("pagehide", persistSize);
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
