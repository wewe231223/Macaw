name: Macaw Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: Macaw-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  Build:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      matrix:
        Configuration: [Debug, Release]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Prepare Premake
        shell: pwsh
        run: |
          $Archive = Join-Path $env:RUNNER_TEMP 'premake.zip'
          $Destination = Join-Path $env:RUNNER_TEMP 'premake'
          Invoke-WebRequest 'https://github.com/premake/premake-core/releases/download/v5.0.0-beta8/premake-5.0.0-beta8-windows.zip' -OutFile $Archive
          if ((Get-FileHash -LiteralPath $Archive -Algorithm SHA256).Hash -ne 'E64CE2ED8778E0098F63674CCA61FE33941B5F0C8D9A4AFD651152BDEA3758AB') { throw 'Premake hash mismatch' }
          Expand-Archive -LiteralPath $Archive -DestinationPath $Destination
          $Destination | Out-File -LiteralPath $env:GITHUB_PATH -Append

      - name: Build
        shell: pwsh
        run: ./Scripts/Build.ps1 -Configuration ${{ matrix.Configuration }}
