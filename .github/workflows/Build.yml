name: Macaw Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: Macaw-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  Build:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      matrix:
        Configuration: [Debug, Release]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Prepare solution
        shell: cmd
        run: call Build.bat -NoPause

      - name: Build
        shell: pwsh
        run: |
          $Locator = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $MSBuild = & $Locator -latest -products '*' -requires Microsoft.Component.MSBuild Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'MSBuild/**/Bin/MSBuild.exe' | Select-Object -First 1
          $Solution = if (Test-Path -LiteralPath 'Macaw.slnx') {
              'Macaw.slnx'
          } else {
              'Macaw.sln'
          }
          & $MSBuild $Solution /m /nologo /verbosity:minimal /p:Configuration=${{ matrix.Configuration }} /p:Platform=x64 /p:VcpkgManifestInstall=false
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }
